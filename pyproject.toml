[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recist11-clinical-qc"
version = "0.3.0"
description = "CSV quality checks for RECIST 1.1 lesion measurement review"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
recist-qc = "recist_qc.cli:main"

[tool.setuptools.packages.find]
include = ["recist_qc*"]
